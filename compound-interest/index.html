<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Compound Interest Calculator</h1>
    </header>
    <main>
        <div id="main-container">
            <label for="principal-amount">Principal Amount</label>
            <input type="number" id="principal-amount">
            
            <label for="interest-rate">Interest Rate</label>
            <input type="number" id="interest-rate">
            <label for="number-of-years">Number of Years</label>
            <input type="number" id="number-of-years">
            <label for="compound-frequency">Compound Frequency</label>
            <input type="number" id="compound-frequency">
            <input type="submit" id="submit" value="submit">
        </div>
        <div id="result-container">
            <p>Final Amount</p>
            <p id="final-amount">0</p>
            <p>Total Interest</p>
            <p id="total-interest">0</p>
        </div>
    </main>
    <footer>
        <h3>Contact</h3>
        <p>Email: <a href="" target="_blank">rawmeal@Gmail.com</a></p>
        <p>Website: <a href="" target="_blank">rawmeal.com</a></p>
        <p>© 2026 Romel</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
